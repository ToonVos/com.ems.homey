<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --tx: var(--homey-text-color, #1c1c1e);
    --dim: var(--homey-text-color-light, #8e8e93);
    --line: rgba(128,128,128,.25);
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tx); padding:10px 12px; background:transparent; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; }
  .tabs button { flex:1; background:rgba(128,128,128,.12); color:var(--dim); border:0; border-radius:8px; padding:6px 0; font-size:12px; cursor:pointer; }
  .tabs button.on { background:rgba(74,144,217,.25); color:var(--tx); font-weight:600; }
  svg { width:100%; display:block; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:10px; color:var(--dim); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:3px; vertical-align:2px; }
  .sub { font-size:10px; color:var(--dim); margin-top:4px; }
  .empty { color:var(--dim); font-size:12px; padding:14px 0; text-align:center; }
</style>
</head>
<body>
<div class="tabs" id="tabs">
  <button data-v="curve" class="on">Grafiek</button>
  <button data-v="today">Vandaag</button>
  <button data-v="week">Week</button>
  <button data-v="month">Maand</button>
</div>
<div id="wrap"><div class="empty">Laden…</div></div>
<div class="legend" id="legend"></div>
<div class="sub" id="sub"></div>

<script>
let Homey = null;
function onHomeyReady(_Homey) {
  Homey = _Homey;
  const C = { pv:'#f6b93b', grid:'#e74c3c', bat:'#2ecc71', ev:'#9b59b6', huis:'#4a90d9', export:'#95a5a6' };
  let data = null, view = 'curve';

  function renderCurve() {
    const wrap = document.getElementById('wrap');
    const slots = data.slots || [];
    const series = { pv:[], grid:[], bat:[], ev:[], huis:[] };
    for (const s of slots) {
      if (!s) { Object.values(series).forEach(a => a.push(null)); continue; }
      series.pv.push(s.pvW ?? 0); series.grid.push(s.gridW ?? 0);
      series.bat.push(s.batW ?? 0); series.ev.push(s.evW ?? 0);
      series.huis.push(Math.max(0, (s.pvW ?? 0) + (s.gridW ?? 0) - (s.batW ?? 0) - (s.evW ?? 0)));
    }
    const all = Object.values(series).flat().filter(v => v != null);
    if (!all.length) { wrap.innerHTML = '<div class="empty">Nog geen metingen vandaag.</div>'; return; }

    // 2× zo hoog voor beter zicht (was 190).
    const W = 1000, H = 380, P = 10, PB = 18;
    const mx = Math.max(1000, ...all.map(Math.abs));
    const x = i => P + i * (W - 2 * P) / 143;
    const y = v => (H - PB) / 2 - v / mx * ((H - PB) / 2 - P);
    let g = `<line x1="${P}" y1="${y(0)}" x2="${W - P}" y2="${y(0)}" stroke="var(--line, rgba(128,128,128,.3))"/>`;
    // horizontale kW-gridlijnen op halve en hele schaal
    for (const f of [-1, -0.5, 0.5, 1]) {
      g += `<line x1="${P}" y1="${y(mx * f)}" x2="${W - P}" y2="${y(mx * f)}" stroke="var(--line, rgba(128,128,128,.15))" stroke-dasharray="3,4"/>`
         + `<text x="${P + 2}" y="${y(mx * f) - 3}" fill="#8e8e93" font-size="10">${(mx * f / 1000).toFixed(1)} kW</text>`;
    }
    for (let h = 0; h <= 24; h += 3) {
      const xx = P + h / 24 * (W - 2 * P);
      g += `<line x1="${xx}" y1="${P}" x2="${xx}" y2="${H - PB}" stroke="var(--line, rgba(128,128,128,.10))"/>`
         + `<text x="${xx}" y="${H - 3}" fill="#8e8e93" font-size="11" text-anchor="middle">${String(h).padStart(2, '0')}</text>`;
    }
    const line = (arr, col, w = 1.8) => {
      let dd = '', pen = false;
      arr.forEach((v, i) => { if (v == null) { pen = false; return; } dd += `${pen ? 'L' : 'M'}${x(i)},${y(v)}`; pen = true; });
      return `<path d="${dd}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    };
    g += line(series.pv, C.pv) + line(series.grid, C.grid) + line(series.bat, C.bat)
       + line(series.ev, C.ev) + line(series.huis, C.huis, 2.4);
    wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
    document.getElementById('legend').innerHTML =
      [['PV', C.pv], ['net (+imp/−exp)', C.grid], ['accu (+laden)', C.bat], ['Tesla', C.ev], ['huis', C.huis]]
        .map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
    document.getElementById('sub').textContent = '';
  }

  function renderTotals(key) {
    const wrap = document.getElementById('wrap');
    const t = data.totals && data.totals[key === 'today' ? 'today' : key];
    if (!t) { wrap.innerHTML = '<div class="empty">Nog geen boekhouding — komt na de eerste volle dag.</div>'; return; }
    const rows = [
      ['☀️ PV', t.pv, C.pv], ['🔻 Import', t.import, C.grid], ['🔺 Export', t.export, C.export],
      ['🏠 Huis', t.huis, C.huis], ['🚗 Tesla', t.ev, C.ev],
      ['🔋 Accu in', t.accu_in, C.bat], ['🔋 Accu uit', t.accu_uit, '#2e8b57'],
    ];
    const mx = Math.max(1, ...rows.map(([, v]) => (typeof v === 'number' ? v : 0)));
    wrap.innerHTML = rows.map(([n, v, c]) => {
      const num = typeof v === 'number';
      return `<div style="display:flex;align-items:center;gap:8px;margin:7px 0">
        <div style="width:86px;font-size:12px">${n}</div>
        <div style="flex:1;height:16px;border-radius:8px;background:rgba(128,128,128,.12);overflow:hidden">
          <div style="width:${num ? 100 * v / mx : 0}%;height:100%;background:${c}"></div></div>
        <div style="width:78px;text-align:right;font-size:12px;font-weight:600">${num ? v.toFixed(1) + ' kWh' : 'n.n.b.'}</div></div>`;
    }).join('');
    document.getElementById('legend').innerHTML = '';
    document.getElementById('sub').textContent =
      (key === 'today'
        ? (t.partial ? 'Vandaag (deels gemeten — import/export volgen na de eerste volle dag).' : 'Vandaag.')
        : `Som van de laatste ${t.days} gemeten dag${t.days === 1 ? '' : 'en'} — historie groeit vanaf nu.`);
  }

  function render() {
    if (!data || !data.ok) { document.getElementById('wrap').innerHTML = '<div class="empty">Geen data.</div>'; return; }
    if (view === 'curve') renderCurve(); else renderTotals(view === 'today' ? 'today' : view);
    Homey.setHeight(document.body.scrollHeight + 8);
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    view = b.dataset.v;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });

  async function load() {
    try { data = await Homey.api('GET', '/getCurve'); render(); }
    catch (e) { document.getElementById('wrap').innerHTML = `<div class="empty">${e.message || e}</div>`; }
  }
  Homey.ready();
  load();
  setInterval(load, 5 * 60 * 1000);
}
</script>
</body>
</html>
