<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --tx: var(--homey-text-color, #1c1c1e);
    --dim: var(--homey-text-color-light, #8e8e93);
    --line: rgba(128,128,128,.25);
    --pv:#f6b93b; --bat:#3ec96f; --grid:#e74c3c; --huis:#4a90d9; --ev:#9b59b6;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tx); padding:10px 12px; background:transparent; }
  .row { margin:8px 0; }
  .row .t { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .row .t b { font-weight:600; }
  .row .t span { color:var(--dim); font-size:11px; }
  .bar { height:16px; border-radius:8px; background:var(--line); overflow:hidden; display:flex; }
  .bar div { height:100%; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:10px; color:var(--dim); margin-top:8px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  .empty { color:var(--dim); font-size:12px; padding:16px 0; text-align:center; }
  .foot { color:var(--dim); font-size:10px; margin-top:6px; }
</style>
</head>
<body>
<div id="rows"><div class="empty">Laden…</div></div>
<div class="legend" id="legend"></div>
<div class="foot" id="foot"></div>

<script>
let Homey = null;
function onHomeyReady(_Homey) {
  Homey = _Homey;
  const C = { zon:'#f6b93b', accu:'#3ec96f', accu_zon:'#3ec96f', accu_net:'#2e8b57',
              net:'#e74c3c', huis:'#4a90d9', ev:'#9b59b6', wp:'#e67e22', boiler:'#16a085', export:'#95a5a6' };

  // Rij-definities: label + segmenten uit de dag-mix (kWh).
  const DEFS = {
    pv: { label:'☀️ PV ging naar', segs: m => [
      ['huis', m.pv_house, C.huis], ['wp', m.pv_hp, C.wp], ['EV', m.pv_ev, C.ev],
      ['accu', m.pv_bat, C.accu], ['boiler', m.pv_boiler, C.boiler], ['export', m._export, C.export]] },
    ev: { label:'🚗 EV geladen met', segs: m => [
      ['zon direct', m.ev_pv, C.zon], ['zon via accu', m.ev_bat_sun, C.accu],
      ['net via accu', m.ev_bat_grid, C.accu_net], ['net', m.ev_grid, C.net]] },
    accu: { label:'🔋 Accu geladen met', segs: m => [
      ['zon', m.bat_in_sun, C.zon], ['net', m.bat_in_grid, C.net]] },
    huis: { label:'🏠 Huis gevoed door', segs: m => [
      ['zon', m.house_pv, C.zon], ['accu (zon)', m.house_bat_sun, C.accu],
      ['accu (net)', m.house_bat_grid, C.accu_net], ['net', m.house_grid, C.net]] },
    wp: { label:'♨️ Warmtepomp', segs: m => [
      ['zon', m.hp_pv, C.zon], ['accu', (m.hp_bat_sun||0)+(m.hp_bat_grid||0), C.accu], ['net', m.hp_grid, C.net]] },
    boiler: { label:'🚿 Boiler (overloop)', segs: m => [
      ['zon', m.boiler_pv, C.zon], ['accu', (m.boiler_bat_sun||0)+(m.boiler_bat_grid||0), C.accu], ['net', m.boiler_grid, C.net]] },
  };

  async function render() {
    try {
      const d = await Homey.api('GET', '/getMix');
      const rowsEl = document.getElementById('rows');
      if (!d || !d.ok || !d.mix) { rowsEl.innerHTML = '<div class="empty">Nog geen metingen vandaag.</div>'; return; }
      const m = { ...d.mix, _export: d.solar_export_kwh || 0 };
      const settings = await Homey.getSettings();
      const wanted = String(settings.rows || 'pv,ev,accu,huis').split(',').map(s => s.trim()).filter(Boolean);
      const showKwh = settings.show_kwh !== false;

      const usedColors = new Map();
      let html = '';
      for (const key of wanted) {
        const def = DEFS[key];
        if (!def) continue;
        const segs = def.segs(m).map(([n, v, c]) => [n, Math.max(0, v || 0), c]).filter(s => s[1] > 0.005);
        const tot = segs.reduce((s, x) => s + x[1], 0);
        if (tot <= 0.01) continue;   // rij zonder data (bv. wp niet gekoppeld) → verbergen
        segs.forEach(([n, , c]) => usedColors.set(n, c));
        html += `<div class="row"><div class="t"><b>${def.label}</b>${showKwh ? `<span>${tot.toFixed(1)} kWh</span>` : ''}</div>
          <div class="bar">${segs.map(([n, v, c]) =>
            `<div style="width:${100*v/tot}%;background:${c}" title="${n}: ${v.toFixed(1)} kWh (${(100*v/tot).toFixed(0)}%)"></div>`).join('')}</div></div>`;
      }
      rowsEl.innerHTML = html || '<div class="empty">Nog geen metingen vandaag.</div>';
      document.getElementById('legend').innerHTML =
        [...usedColors].map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
      const bm = d.bat_mix;
      document.getElementById('foot').textContent =
        (bm && bm.sun_pct != null ? `Accu bevat nu ~${bm.sun_pct}% zonnestroom · ` : '') +
        (d.partial ? 'deels gemeten (gestart mid-dag) · ' : '') + d.date;
      Homey.setHeight(document.body.scrollHeight + 8);
    } catch (e) {
      document.getElementById('rows').innerHTML = `<div class="empty">${e.message || e}</div>`;
    }
  }

  Homey.ready();
  render();
  setInterval(render, 5 * 60 * 1000);
}
</script>
</body>
</html>
